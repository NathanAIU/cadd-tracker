name: Weekly CADD Tools Auto-Scan

on:
  schedule:
    # Every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'How many days back to scan (default 90)'
        required: false
        default: '90'

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push updated JSON files

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests biopython pandas openpyxl streamlit

      - name: Run scanner
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}   # optional — free from NCBI
        run: |
          DAYS=${{ github.event.inputs.days_back || '90' }}
          python utils/scanner.py $DAYS

      - name: Commit updated data files
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pending.json data/scan_history.json
          git diff --cached --quiet || git commit -m "chore: auto-scan $(date -u +%Y-%m-%d)"
          git push
